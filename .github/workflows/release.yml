name: Release

# Builds standalone apps on native runners. A v* tag also publishes them as a GitHub release;
# a manual run only builds and smoke-tests them.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: macos-arm64.zip
          - os: macos-15-intel
            asset: macos-x64.zip
          - os: ubuntu-22.04
            asset: linux-amd64.deb
          - os: windows-latest
            asset: windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Read version
        run: |
          version=$(python -c "import re; print(re.search(r\"^VERSION = '([^']+)'\", open('backend/version.py').read(), re.M).group(1))")
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match VERSION $version in backend/version.py" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ASSET=TokenObservatory-$version-${{ matrix.asset }}" >> "$GITHUB_ENV"
      - name: Install and test
        timeout-minutes: 10
        run: |
          python -m pip install '.[test]' pyinstaller 'PySide6-Essentials>=6.5,<7'
          npm ci --prefix frontend
          npm run test --prefix frontend -- --run
          npm run build --prefix frontend
          python -c "import shutil; shutil.copytree('frontend/dist', 'backend/static', dirs_exist_ok=True)"
          python -m pytest -q
      - name: Build
        run: |
          # The floating widget is optional; drop Qt so the released build stays small.
          python -m pip uninstall -y PySide6-Essentials PySide6
          python -m pip install pyinstaller==6.11.1
          pyinstaller --noconfirm packaging/token_observatory.spec
      - name: Package and smoke-test (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        run: |
          app="dist/Token Observatory.app/Contents/MacOS/TokenObservatory"
          "$app" --no-open --port 8799
          curl --fail --silent http://127.0.0.1:8799/ > /dev/null
          "$app" --stop --port 8799
          ditto -c -k --keepParent "dist/Token Observatory.app" "$ASSET"
      - name: Package and smoke-test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          python packaging/build_deb.py dist/token-observatory "$VERSION" "$ASSET"
          sudo apt-get install -y "./$ASSET"
          token-observatory --version
          token-observatory --no-open --port 8799
          curl --fail --silent http://127.0.0.1:8799/ > /dev/null
          token-observatory --stop --port 8799
      - name: Package and smoke-test (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: pwsh
        run: |
          Copy-Item dist/token-observatory.exe $env:ASSET
          # Wait for the launcher only; the collector it starts keeps running in the background.
          $launcher = Start-Process -FilePath ./$env:ASSET -ArgumentList '--no-open','--port','8799' -PassThru
          $launcher.WaitForExit()
          if ($launcher.ExitCode -ne 0) { throw "Launcher exited with $($launcher.ExitCode)" }
          Invoke-WebRequest -UseBasicParsing -TimeoutSec 10 http://127.0.0.1:8799/ | Out-Null
          $stopper = Start-Process -FilePath ./$env:ASSET -ArgumentList '--stop','--port','8799' -PassThru
          $stopper.WaitForExit()
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source release assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          mkdir -p source-release
          git archive HEAD | tar -x -C source-release
          mkdir -p source-release/backend/static
          cp -R frontend/dist/. source-release/backend/static/
          python3 -m pip install uv==0.11.16
          uv python install 3.12.13-linux-x86_64-gnu 3.12.13-linux-aarch64-gnu --install-dir "$RUNNER_TEMP/legacy-python" --no-bin
          python3 packaging/build_legacy_runtime.py "$RUNNER_TEMP/legacy-python/cpython-3.12.13-linux-x86_64-gnu" "$RUNNER_TEMP/linux-x86_64.zip"
          python3 packaging/build_legacy_runtime.py "$RUNNER_TEMP/legacy-python/cpython-3.12.13-linux-aarch64-gnu" "$RUNNER_TEMP/linux-aarch64.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The source archive lets source installs (build_app.py, install.sh) update themselves.
          python3 packaging/build_source.py source-release "assets/TokenObservatory-${GITHUB_REF_NAME#v}-source.tar.gz" "${GITHUB_REF_NAME#v}" "assets/TokenObservatory-${GITHUB_REF_NAME#v}-macos-arm64.zip" "assets/TokenObservatory-${GITHUB_REF_NAME#v}-macos-x64.zip" "$RUNNER_TEMP/linux-x86_64.zip" "$RUNNER_TEMP/linux-aarch64.zip"
          (cd assets && sha256sum * > SHA256SUMS.txt)
          # Release notes: this version's CHANGELOG section, then the install guide.
          version="${GITHUB_REF_NAME#v}"
          { head -n 2 packaging/release-notes.md; echo "## What's new"; awk -v v="$version" '/^## \[/{found = index($0, "[" v "]") > 0; next} /^\[/{found = 0} found' CHANGELOG.md; tail -n +3 packaging/release-notes.md; } > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* --title "Token Observatory $GITHUB_REF_NAME" --notes-file notes.md
